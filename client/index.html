<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IncidentIOQ — catch the bug that never throws</title>
    <meta name="description" content="A live war room for silent dev-environment failures, with AI drafts you confirm and the teammate who knows the code flagged." />
    <!-- picks the theme before first paint so the page never flashes the wrong one; mirrors src/theme/theme.ts (key: iiq-theme) -->
    <script>
      try {
        var c = localStorage.getItem('iiq-theme');
        document.documentElement.dataset.theme =
          c === 'light' || c === 'dark' ? c : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
